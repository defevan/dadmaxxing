# GitHub Pages publish disabled — dad.evanjon.es is served via Cloudflare Tunnel
# from Dokploy/Caddy on norfair. Re-enable only if you intentionally return to Pages.
name: deploy

on:
  workflow_dispatch: {}

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: deploy to github pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: dad.evanjon.es
